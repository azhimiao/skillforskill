name: Skills CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build registry
        run: python skill-core/skill.py registry build

      - name: Compile examples
        run: python skill-core/skill.py compile examples

      - name: Check IR drift
        run: python skill-core/skill.py diff examples

      - name: Validate skills
        run: python skill-core/skill.py validate examples

      - name: Run tests
        run: python skill-core/skill.py test examples

      - name: List registry
        run: python skill-core/skill.py list -v
