[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforskill"
version = "2.0.0"
description = "Vendor-neutral toolchain for building, testing, and installing Agent Skills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
keywords = ["agent-skills", "cursor", "claude", "ai", "skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/azhimiao/skillforskill"
Documentation = "https://github.com/azhimiao/skillforskill#readme"
Repository = "https://github.com/azhimiao/skillforskill"

[project.scripts]
skill = "skill_core_cli:main"

[tool.setuptools]
py-modules = ["skill_core_cli"]
